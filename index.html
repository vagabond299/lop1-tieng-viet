<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 BÉ VUI HỌC TIẾNG VIỆT LỚP 1 🐰</title>
  
  <!-- Google Fonts & Font Awesome CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700;900&family=Quicksand:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-pink: #FF6584;
      --pink-dark: #E11D48;
      --pink-soft: #FFF0F5;
      --purple-soft: #F3E8FF;
      --purple-dark: #9333EA;
      --mint: #A7F3D0;
      --mint-dark: #059669;
      --yellow-cream: #FEF08A;
      --yellow-dark: #D97706;
      --dark-text: #1E293B;
      --pastel-bg: linear-gradient(135deg, #FDE2E4 0%, #F5D0FE 50%, #EDE9FE 100%);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Nunito', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body {
      background: var(--pastel-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    #app-container {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 1200px;
      height: min(98vh, 850px);
      border-radius: 28px;
      box-shadow: 0 16px 45px rgba(225, 29, 72, 0.16);
      border: 5px solid #FFFFFF;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* OVERLAY KHỞI ĐỘNG */
    #start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #FFA5BA 0%, #F472B6 45%, #C084FC 100%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: white;
    }

    .mascot-avatar-big {
      font-size: 80px;
      animation: float 2.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.12));
      margin-bottom: 10px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .big-start-btn {
      background: #FEF08A;
      color: #92400E;
      font-size: 24px;
      font-weight: 900;
      padding: 16px 48px;
      border-radius: 50px;
      border: none;
      box-shadow: 0 7px 0 #D97706;
      cursor: pointer;
      margin-top: 22px;
      animation: pulse 1.6s infinite;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .big-start-btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #D97706;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* HEADER */
    header {
      background: #FFF5F8;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #FBCFE8;
      gap: 10px;
      height: 58px;
      flex-shrink: 0;
    }

    .header-left-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .header-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--pink-dark);
      text-transform: uppercase;
      text-align: center;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }

    .score-badge {
      background: linear-gradient(135deg, #FEF08A, #FDE047);
      color: #854D0E;
      font-size: 17px;
      font-weight: 900;
      padding: 6px 16px;
      border-radius: 50px;
      box-shadow: 0 3px 0 #CA8A04;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-nav {
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      font-size: 15px;
      font-weight: 800;
      color: var(--dark-text);
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 3px 0 #94A3B8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.1s;
      white-space: nowrap;
    }
    .btn-nav:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #94A3B8;
    }

    /* BREADCRUMB TABS CLICKABLE */
    .topic-active-tab {
      background: linear-gradient(135deg, #FFE4E6, #FCE7F3);
      border: 2px solid #F43F5E;
      color: #BE185D;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 16px;
      box-shadow: 0 3px 0 #FDA4AF;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.1s;
    }
    .topic-active-tab:hover { background: #FFD1DC; }
    .topic-active-tab:active { transform: translateY(2px); box-shadow: 0 1px 0 #FDA4AF; }

    .subtopic-active-tab {
      background: linear-gradient(135deg, #E0F2FE, #BAE6FD);
      border: 2px solid #0284C7;
      color: #0369A1;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 16px;
      box-shadow: 0 3px 0 #7DD3FC;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.1s;
    }
    .subtopic-active-tab:hover { background: #BAE6FD; }
    .subtopic-active-tab:active { transform: translateY(2px); box-shadow: 0 1px 0 #7DD3FC; }

    /* MAIN CONTENT */
    #main-content {
      flex: 1;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      min-height: 0;
      overflow: hidden;
    }

    .hub-title {
      font-size: 26px;
      font-weight: 900;
      color: #BE185D;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* DASHBOARD TOPICS GRID */
    .topics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      flex: 1;
      max-height: 560px;
    }

    .topic-card {
      background: #FFFFFF;
      border: 3px solid var(--primary-pink);
      border-radius: 20px;
      padding: 10px 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 5px 0 #FB7185;
      position: relative;
    }
    .topic-card:hover { transform: translateY(-3px); background: #FFF1F2; }
    .topic-card:active { transform: translateY(2px); box-shadow: 0 1px 0 #FB7185; }
    .topic-card .icon { font-size: 34px; }
    .topic-card .title { font-size: 17px; font-weight: 900; color: #881337; line-height: 1.25; }
    .topic-card .badge {
      font-size: 13.5px;
      font-weight: 900;
      background: #FCE7F3;
      color: #BE185D;
      padding: 3px 12px;
      border-radius: 12px;
      border: 1px solid #FBCFE8;
    }

    /* SUBMENU CHUYÊN ĐỀ 1 */
    .submenu-container {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex: 1;
    }

    .submenu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
      width: 100%;
    }

    .submenu-card {
      background: #FFFFFF;
      border: 3.5px solid #F43F5E;
      border-radius: 26px;
      padding: 26px 20px;
      cursor: pointer;
      box-shadow: 0 8px 0 #FDA4AF;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .submenu-card:hover { transform: translateY(-4px); background: #FFF5F7; }
    .submenu-card:active { transform: translateY(3px); box-shadow: 0 2px 0 #FDA4AF; }
    .submenu-card .s-icon { font-size: 56px; }
    .submenu-card .s-title { font-size: 22px; font-weight: 900; color: #9F1239; }
    .submenu-card .s-desc { font-size: 16px; font-weight: 700; color: #64748B; line-height: 1.5; }

    /* BẢNG CHỮ CÁI */
    .alpha-board-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .alpha-top-header {
      font-size: 19px;
      font-weight: 900;
      color: #9333EA;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .alpha-cards-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 10px;
      width: 100%;
      flex: 1;
      max-height: 220px;
    }

    .letter-main-card {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFF1F4 100%);
      border: 2.5px solid #F472B6;
      border-radius: 18px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 0 #FDA4AF;
    }

    .char-display-group {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
    }

    .big-char-print {
      font-size: 44px;
      font-weight: 900;
      color: #E11D48;
      line-height: 1;
    }

    .big-char-script {
      font-family: 'Dancing Script', 'Brush Script MT', cursive;
      font-size: 48px;
      font-weight: 700;
      color: #0284C7;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(2, 132, 199, 0.2);
    }

    .letter-main-card .read-label {
      font-size: 16px;
      font-weight: 800;
      color: #7C3AED;
    }

    .example-item-card {
      background: #FFFFFF;
      border: 2.5px solid #6EE7B7;
      border-radius: 18px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      box-shadow: 0 4px 0 #10B981;
      cursor: pointer;
      transition: all 0.12s;
    }
    .example-item-card:hover { transform: translateY(-3px); background: #F0FDF4; }
    .example-item-card:active { transform: translateY(2px); }

    .example-item-card .ex-emoji { font-size: 34px; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.1)); }
    .example-item-card .ex-word { font-size: 18px; font-weight: 900; color: #065F46; }
    .example-item-card .ex-tag {
      font-size: 12px;
      font-weight: 800;
      background: #E0E7FF;
      color: #4338CA;
      padding: 2px 8px;
      border-radius: 8px;
    }
    .example-item-card .ex-sentence { font-size: 14px; font-weight: 700; color: #475569; line-height: 1.3; }

    .btn-card-listen {
      background: #FEF08A;
      border: 1.5px solid #CA8A04;
      color: #854D0E;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 3px;
    }

    /* BÀN PHÍM CHỮ CÁI */
    .alpha-keyboard-box {
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      border-radius: 18px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .key-btn {
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      color: #1E293B;
      font-size: 20px;
      font-weight: 900;
      min-width: 48px;
      height: 50px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #94A3B8;
      transition: all 0.1s;
      padding: 0 4px;
    }
    .key-btn .key-sub { font-size: 13.5px; font-weight: 800; color: #64748B; margin-top: -3px; }
    .key-btn:hover { background: #FDF2F8; border-color: #F472B6; color: #E11D48; }
    .key-btn.active {
      background: #E11D48 !important;
      border-color: #BE123C !important;
      color: #FFFFFF !important;
      box-shadow: 0 3px 0 #9F1239 !important;
    }
    .key-btn.active .key-sub { color: #FEF08A !important; }

    /* TRẮC NGHIỆM CHUNG */
    .question-prompt {
      font-size: 20px;
      font-weight: 900;
      color: #1E293B;
      margin-bottom: 6px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .speaker-btn {
      background: #FDF2F8;
      border: 2px solid #F472B6;
      font-size: 15px;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: #BE185D;
      box-shadow: 0 2px 0 #F472B6;
      transition: 0.1s;
    }
    .speaker-btn:active { transform: translateY(2px); box-shadow: none; }

    .stage-box {
      height: 140px;
      background: linear-gradient(180deg, #FFFDF9 0%, #FFF5F8 100%);
      border-radius: 20px;
      border: 2.5px dashed #FBCFE8;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      margin-bottom: 8px;
      box-shadow: inset 0 2px 6px rgba(251, 207, 232, 0.4);
      flex-shrink: 0;
    }

    /* ĐỌC HIỂU (CHỮ TO RÕ THEO YÊU CẦU) */
    .reading-2q-container {
      width: 100%;
      max-width: 1140px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-height: 0;
    }

    .reading-passage-box {
      height: 135px;
      background: #FFFBF5;
      border: 2.5px dashed #FDBA74;
      border-radius: 18px;
      padding: 10px 18px;
      text-align: left;
      overflow-y: auto;
      box-shadow: inset 0 2px 4px rgba(253, 186, 116, 0.25);
    }
    .reading-passage-box .p-title {
      font-size: 22px;
      font-weight: 900;
      color: #EA580C;
      margin-bottom: 4px;
    }
    .reading-passage-box .p-text {
      font-size: 20px;
      line-height: 1.6;
      font-weight: 700;
      color: #1E293B;
    }

    .two-questions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .q-panel {
      background: #FFFFFF;
      border: 2.5px solid #E2E8F0;
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 0 #CBD5E1;
    }
    .q-panel .q-title {
      font-size: 19px;
      font-weight: 900;
      color: #7C3AED;
      text-align: left;
      line-height: 1.35;
    }
    .q-panel .q-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .reading-choice-btn {
      background: #FFFFFF;
      border: 2.5px solid #6EE7B7;
      color: #065F46;
      font-size: 18px;
      font-weight: 900;
      padding: 10px 8px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 #10B981;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 48px;
      line-height: 1.3;
    }
    .reading-choice-btn:hover { background: #ECFDF5; }
    .reading-choice-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #10B981; }

    .choices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 8px;
    }

    .choice-btn {
      background: #FFFFFF;
      border: 2.5px solid #6EE7B7;
      color: #065F46;
      font-size: 20px;
      font-weight: 900;
      padding: 10px 10px;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #10B981;
      transition: all 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 52px;
    }
    .choice-btn:hover { background: #ECFDF5; }
    .choice-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #10B981; }

    .correct {
      background: #34D399 !important;
      color: white !important;
      border-color: #059669 !important;
      box-shadow: 0 4px 0 #047857 !important;
    }
    .wrong {
      background: #FB7185 !important;
      color: white !important;
      border-color: #E11D48 !important;
      box-shadow: 0 4px 0 #BE123C !important;
    }

    /* GIAO DIỆN SẮP XẾP CÂU ĐÚNG (MỤC 5) */
    .order-sentence-wrap {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: center;
    }

    .sentence-answer-zone {
      min-height: 80px;
      width: 100%;
      background: #FFFDF9;
      border: 3px dashed #F472B6;
      border-radius: 22px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
    }
    .sentence-answer-zone.completed-correct {
      background: #ECFDF5;
      border-color: #10B981;
      border-style: solid;
    }
    .sentence-answer-zone.completed-wrong {
      background: #FFF1F2;
      border-color: #F43F5E;
    }

    .sentence-pool-zone {
      min-height: 68px;
      width: 100%;
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .word-token-btn {
      background: linear-gradient(180deg, #FFFFFF 0%, #FDF2F8 100%);
      border: 2.5px solid #F472B6;
      color: #BE185D;
      font-size: 22px;
      font-weight: 900;
      padding: 10px 22px;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #FDA4AF;
      transition: all 0.12s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .word-token-btn:hover {
      transform: translateY(-2px);
      background: #FFE4E6;
    }
    .word-token-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #FDA4AF;
    }
    .word-token-placed {
      background: linear-gradient(180deg, #E0F2FE 0%, #BAE6FD 100%);
      border-color: #0284C7;
      color: #0369A1;
      box-shadow: 0 4px 0 #7DD3FC;
    }

    /* MASCOT BAR */
    .mascot-bar {
      height: 38px;
      background: #FFF1F4;
      border-radius: 40px;
      padding: 4px 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid #FECDD3;
      max-width: 900px;
      margin-top: 4px;
      margin-bottom: 4px;
    }
    .mascot-bar .mascot-ico { font-size: 22px; }
    .mascot-bar .mascot-msg { font-size: 16px; font-weight: 800; color: #9F1239; }

    /* FOOTER CONTROLS */
    .nav-control-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      max-width: 820px;
      height: 44px;
      flex-shrink: 0;
    }

    .btn-step {
      background: #FFFFFF;
      border: 2.5px solid #F43F5E;
      color: #E11D48;
      font-size: 16px;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 0 #BE123C;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.12s;
    }
    .btn-step:hover:not(:disabled) {
      background: #FFE4E6;
      transform: translateY(-2px);
    }
    .btn-step:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #BE123C;
    }

    function stopAllAudio() {
      try {
        if (banMaiAudio) {
          banMaiAudio.pause();
          banMaiAudio.currentTime = 0;
          banMaiAudio.src = '';
        }
      } catch (e) {}
    }

    function initAppAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
      playTone('correct');
      speakClear("Chào bé yêu! Thỏ Hồng rất vui được học Tiếng Việt cùng bé!");
      document.getElementById('start-overlay').style.display = 'none';
      renderHub();
    }

    function playTone(type) {
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          // Tiếng "bíp" rõ ràng báo hiệu chọn sai: 2 tiếng bíp ngắn, sắc
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.01);
          gain.gain.setValueAtTime(0.22, now + 0.09);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.1);
          gain.gain.setValueAtTime(0.001, now + 0.14);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.15);
          gain.gain.setValueAtTime(0.22, now + 0.23);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    // bị đổi sang giọng khác (có thể là giọng nam) khi máy không có giọng nữ.
    function speakClear(text) {
      try {
        stopAllAudio();

        let cleanText = text.replace(/b-a/g, 'bờ a ba')
                            .replace(/c\/k/g, 'cờ hoặc ca')
                            .replace(/g\/gh/g, 'gờ đơn hoặc gờ kép')

        const encoded = encodeURIComponent(cleanText.trim());
        const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${encoded}`;

        banMaiAudio.src = ttsUrl;
        banMaiAudio.playbackRate = 0.96;

    // =========================================================================
    const canvas = document.getElementById('fx-canvas');

    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      resizeCanvas();
      particles = [];
      const colors = ['#FF69B4', '#FFB6C1', '#F43F5E', '#A7F3D0', '#FEF08A', '#BAE6FD', '#C084FC'];
      for (let i = 0; i < 40; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14 - 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 7 + 4,
          life: 1
        });
      }
    }

    function renderFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.28;
        p.life -= 0.025;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        if (p.life <= 0) particles.splice(idx, 1);
      });
      requestAnimationFrame(renderFX);
    }

      { r: 'Con gì thích ăn chuối, hay leo trèo và gãi đầu gãi tai?', a: 'Con khỉ', s: 'Chú khỉ thông minh' },
      { r: 'Quả gì vỏ xanh ruột đỏ, hạt đen nhánh, ăn giải nhiệt mùa hè?', a: 'Quả dưa hấu', s: 'Quả dưa hấu mát ngọt' },
      { r: 'Cái gì có 2 bánh, bé đạp bằng chân để chạy bon bon?', a: 'Xe đạp', s: 'Chiếc xe đạp nhỏ của bé' },
      { r: 'Con gì đẻ trứng trong ổ rơm, cục ta cục tác?', a: 'Con gà mái', s: 'Con gà mái đẻ trứng' },
      { r: 'Con gì bơi dưới nước, có vây có vảy óng ánh?', a: 'Con cá', s: 'Con cá bơi lội tung tăng' },
      { r: 'Cái gì giơ lên che khi trời đổ mưa hoặc nắng gắt?', a: 'Cây dù (ô)', s: 'Cây dù che mưa nắng' },
      { r: 'Vào ban đêm, cái gì tỏa sáng tròn vành vạnh trên trời?', a: 'Mặt trăng', s: 'Mặt trăng tròn sáng ngời' },
      { r: 'Cái gì xuất hiện 7 màu lung linh sau cơn mưa rào?', a: 'Cầu vồng', s: 'Cầu vồng bảy sắc' },
      { r: 'Con gì siêng năng bay đi tìm hoa hút mật ngọt về tổ?', a: 'Con ong', s: 'Con ong chăm chỉ' },
      { r: 'Con gì rực rỡ sắc màu, lượn bay dập dờn bên khóm hoa?', a: 'Con bướm', s: 'Con bướm rực rỡ' },
      { r: 'Con gì có bờm to lớn, được mệnh danh là chúa sơn lâm?', a: 'Sư tử', s: 'Sư tử dũng mãnh chúa tể rừng xanh' },
      { r: 'Cái gì dùng để đựng sách vở, đồ dùng mỗi khi bé tới trường?', a: 'Cặp sách', s: 'Chiếc cặp sách xinh xắn' },
      { r: 'Cái gì mềm mại giúp bé tẩy sạch những vết bút chì viết sai?', a: 'Cục tẩy (gôm)', s: 'Cục tẩy bút chì' },
      { r: 'Quả gì trĩu ngọt từng chùm, màu tím màu xanh bé thích ăn?', a: 'Chùm nho', s: 'Chùm nho mọng nước' },
      { r: 'Cây gì gắn liền với làng quê, thân xanh đốt dài làm cổng làng?', a: 'Cây tre', s: 'Cây tre xanh rì rào' },
      { r: 'Quả gì vỏ màu vàng cong cong, khỉ và bé đều mê tít?', a: 'Quả chuối', s: 'Quả chuối tiêu ngọt thơm' },
      { r: 'Con gì sủa gâu gâu, ngoan ngoãn giữ nhà cho chủ?', a: 'Con chó', s: 'Chú chó trung thành' },
      { r: 'Con gì kêu ủn ỉn, thân béo tròn, thích ăn no rồi ngủ?', a: 'Con lợn (heo)', s: 'Chú lợn ủn ỉn' },
      { r: 'Con gì giúp bác nông dân cày ruộng bậc thang chăm chỉ?', a: 'Con trâu', s: 'Con trâu cần cù' },
      { r: 'Con gì cho chúng ta nguồn sữa thơm ngon béo ngậy mỗi ngày?', a: 'Bò sữa', s: 'Con bò sữa hiền lành' },
      { r: 'Cái gì trên mặt đường có 3 màu xanh, vàng, đỏ chỉ dẫn giao thông?', a: 'Đèn giao thông', s: 'Đèn tín hiệu giao thông' },
      { r: 'Mỗi khi mùa hè đến, con gì cất tiếng ve ve trên cành phượng vĩ?', a: 'Con ve sầu', s: 'Con ve sầu mùa hạ' },
      { r: 'Hoa gì báo hiệu mùa xuân về trên khắp miền Bắc nước ta?', a: 'Hoa đào', s: 'Cành hoa đào đón xuân' },
      { r: 'Hoa gì màu vàng rực rỡ khoe sắc đón Tết ở miền Nam?', a: 'Hoa mai', s: 'Hoa mai vàng đón Tết' },
      { r: 'Vào dịp Trung thu, bánh gì hình tròn và hình vuông thơm ngọt?', a: 'Bánh trung thu', s: 'Bánh nướng bánh dẻo trung thu' },
      { r: 'Đêm trung thu, bé rước chiếc đèn lồng hình gì 5 cánh?', a: 'Đèn ông sao', s: 'Đèn ông sao lung linh' },
      { r: 'Đố bé người thầy đầu tiên dạy bé từng nét chữ ở lớp 1?', a: 'Cô giáo (Thầy giáo)', s: 'Thầy cô kính yêu' },
      { r: 'Con gì ban ngày nhắm mắt ngủ, ban đêm mở to mắt đi săn mồi?', a: 'Con cú mèo', s: 'Con cú mèo' },
      { r: 'Quả gì nhỏ xíu màu đỏ tươi, vị cay xè mà người lớn hay ăn?', a: 'Quả ớt', s: 'Quả ớt đỏ cay nồng' },
      { r: 'Quả gì vỏ nhiều gai, nhiều người bảo thơm ngọt, người lại sợ mùi?', a: 'Quả sầu riêng', s: 'Quả sầu riêng thơm béo' },
      { r: 'Cái gì để bé nằm ngủ êm ái, gối đầu ban đêm?', a: 'Cái gối', s: 'Cái gối êm ái' },
      { r: 'Cái gì bé đắp mỗi khi trời trở rét cho ấm áp?', a: 'Cái chăn (mền)', s: 'Chiếc chăn ấm áp' },
      { r: 'Con gì chân ngắn, mỏ dẹp kêu cạp cạp bơi trên ao?', a: 'Con vịt', s: 'Con vịt bầu' },
      { r: 'Cái gì bé mang ở chân cùng đôi tất xinh xắn khi đi học?', a: 'Đôi giày', s: 'Đôi giày thể thao' },
      { r: 'Nước gì từ trên trời rơi xuống tưới mát cỏ cây ruộng đồng?', a: 'Nước mưa', s: 'Những hạt mưa rào' },
      { r: 'Cái gì bay phấp phới trên cột cờ, nền đỏ sao vàng?', a: 'Lá cờ Tổ quốc', s: 'Lá cờ đỏ sao vàng' },
      { r: 'Ai là người sinh ra bé, luôn yêu thương và nấu ăn ngon cho bé?', a: 'Người mẹ', s: 'Mẹ yêu kính' },
      { r: 'Hoa gì chỉ nở mùa hè, dang tay đón bạn ve về đỏ cây, ở trên mái phố suốt ngày?', a: 'Hoa phượng', s: 'Hoa phượng đỏ rực mùa hè' },
      { r: 'Đỏ bừng khắp cả mình cây, khi quả chín vỡ bông bay khắp vùng, tên nghe chẳng lạ, nhà nhà đều dùng để nấu cơm, là hoa gì?', a: 'Hoa gạo', s: 'Hoa gạo đỏ bên cây gạo cổ thụ' },
      { r: 'Mình vuông vức, áo xanh xanh, da xanh thịt trắng, đỗ hành ở trong, là bánh gì?', a: 'Bánh chưng', s: 'Bánh chưng ngày Tết' },
      { r: 'Quả tròn to, da xanh xanh, ruột trong đỏ chót mát lành, hạt đen bé tí, ăn vào hết khát, là quả gì?', a: 'Quả dưa hấu', s: 'Quả dưa hấu đỏ mọng nước' },
      { r: 'Rõ ràng chẳng phải nồi canh, thế mà vị mặn, nước xanh, cá nhiều, là gì?', a: 'Biển', s: 'Biển rộng bao la' },
      { r: 'Giữa trời biển nước bao la, không ai bồi đắp mà cao, là gì?', a: 'Bầu trời', s: 'Bầu trời cao rộng' },
      { r: 'Ruột dài từ mũi đến chân. Bé tô, bé vẽ ruột dần mòn theo. Là cái gì?', a: 'Cái bút chì' },
      { r: 'Bút gì màu đỏ, màu xanh. Mẹ mua cho bé vẽ tranh tô màu?', a: 'Cái bút màu' },
      { r: 'Thân em dài, trắng lại tròn. Viết bao nhiêu chữ em mòn bất nhiêu. Là gì?', a: 'Viên phấn' },
      { r: 'Vừa mềm, vừa bé bỏng thôi. Mà làm sạch vết mực rơi mới tài. Là cái gì?', a: 'Cục tẩy' },
      { r: 'Cài gì hai lưỡi không răng. Mà nhai giấy vải băng băng lạ kỳ. Là cái gì?', a: 'Cái kéo' },
      { r: 'Suốt đời đi với học sinh Sách, vở, thước, bút trong mình tôi mang. Là cái gì?', a: 'Cái cặp' },
      { r: 'Cái gì thường vẫn để đo Giúp anh học trò kẻ, vẽ thường xuyên?', a: 'Cái thước kẻ' },
      { r: 'Đầu đuôi vuông vắn như nhau. Thân chia nhiều đốt rất mau rất đều. Tính tình chân thực đáng yêu. Muốn biết dài ngắn mọi điều có em. Là cái gì?', a: 'Thước kẻ' },
      { r: 'Con gì hai mắt trong veo. Thích nằm sưởi nắng, thích trèo cây cau.', a: 'Con mèo' },
      { r: 'Vừa bằng quả mướp ăn cướp cả làng? Hỏi là con gì?', a: 'Con chuột' },
      { r: 'Thường nằm đầu hè. Giữ cho nhà chủ. Người lạ nó sủa. Người quen nó mừng. Là con gì?', a: 'Con chó' },
      { r: 'Con gì mào đỏ. Gáy ò ó o… Từ sáng tinh mơ. Gọi người thức giấc?', a: 'Con gà trống' },
      { r: 'Con gì kêu rít rít. Theo mẹ ra bờ ao. Chẳng khác mẹ tí nào. Cũng lạch bà lạch bạch. Đố bé, là con gì?', a: 'Con vịt con' },
      { r: 'Trên bờ lạch bạch chậm ghê. Ao hồ nhẹ lướt hả hê quên ngày. Là con gì?', a: 'Con vịt' },
      { r: 'Con gì quang quác. Cục tác cục te. Đẻ trứng tròn xoe. Gọi người đến lấy.', a: 'Con gà mái' },
      { r: 'Bốn cây cột đình. Hai đinh nhọn hoắt. Hai cái lúc lắc. Một cái tòng teng. Trùng trục da đen. Lại ưa đầm vũng? Là con gì?', a: 'Con trâu' },
      { r: 'Là trâu nhưng chưa có sừng. Luôn kêu ‘nghé ọ’ tung tăng chơi đùa. Là con gì?', a: 'Con nghé' },
      { r: 'Có cánh, lông trắng, chân dài. Trong lời ru mẹ nhắc hoài tới tôi. Là con gì?', a: 'Con cò' },
      { r: 'Con bò con là nó. Nhưng chẳng gọi ‘bò con’. Bé thử đoán luôn xem. Là con gì thế nhỉ?', a: 'Con bê' },
      { r: 'Một lòng khuya sớm chuyên cần. Trách người vô nghĩa, sao chê ngu đần?', a: 'Con bò' },
      { r: 'Con gì tám cẳng hai càng. Chẳng đi mà lại bò ngang cả ngày. Đố bé, là con gì?', a: 'Con cua' },
      { r: 'Cá gì vốn rất hiền lành. Xưa được chị Tấm dỗ dành nuôi cơm.', a: 'Cá bống' },
      { r: 'Cá gì mà chẳng có mang. Đuôi to, chân lớn, mồn càng khiếp ghê.', a: 'Cá sấu' },
      { r: 'Nhởn nhơ bơi lội lượn vòng. Đuôi mềm mại như dải lụa hồng xòe ra. Là con cá gì?', a: 'Con cá vàng' },
      { r: 'Con gì to nhất biển khơi. Trên lưng phun nước. Dong chơi thông ngày.', a: 'Cá voi' },
      { r: 'Con gì trên mép có râu. Cuối năm cùng Táo quân về trời.', a: 'Cá chép' },
      { r: 'Con gì là cậu ông Trời. Ai mà đánh nó thì trời đánh cho?', a: 'Con cóc' },
      { r: 'Con gì bên ngoài trắng phau phau. Trong bụng lại có mực một màu đen thui.', a: 'Con mực' },
      { r: 'Con gì vừa bằng quả ổi. Khi nổi khi chìm?', a: 'Con ốc' },
      { r: 'Trên lợp ngói dưới có hoa. Một thằng ló cổ ra bốn thằng rung rinh chạy. Hỏi là con gì?', a: 'Con rùa' },
      { r: 'Chỉ bằng hạt quýt dưới đít ngậm châu. Hỏi là con gì?', a: 'Con đom đóm' },
      { r: 'Bằng sợi chỉ rủ rỉ trong bụi. Hỏi là con gì?', a: 'Con muỗi' },
      { r: 'Con gì nhỏ bé Mà hát khỏe ghê Suốt cả mùa hè Râm ran hợp xướng.', a: 'Con ve sầu' },
      { r: 'Con gì đôi cánh mỏng tang Bay cao bay thấp báo rằng nắng mưa? Đố là con gì?', a: 'Con chuồn chuồn' },
      { r: 'Chim gì miệng tựa thoi đưa. Báo mùa xuân đẹp say sưa giữa trời.', a: 'Con chim én' },
      { r: 'Hòa bình ước muốn ngàn đời Theo cánh chim trắng tung trời lượn bay Là chim gì?', a: 'Con chim bồ câu' },
      { r: 'Cái gì một cặp song sinh. Long lanh, sáng tỏ để nhìn xung quanh?', a: 'Đôi mắt' },
      { r: 'Nhô cao giữa mặt một mình. Hít thở thật giỏi lại tinh ngửi mùi. Là gì?', a: 'Cái mũi' },
      { r: 'Cái gì chúm chím đáng yêu. Thốt lời chào hỏi, nói điều hay?', a: 'Cái miệng' },
      { r: 'Lắng nghe tiếng mẹ, tiếng cô. Âm thanh, tiếng động nhỏ, to quanh mình. Là gì?', a: 'Cái tai' },
      { r: 'Cái gì tài giỏi lắm thay. Quét nhà giúp mẹ, viết bài, vẽ tranh?', a: 'Bàn tay' },
      { r: 'Cái gì giúp bé bước nhanh. Đến trường gặp bạn học hành bè ơi?', a: 'Bàn chân' },
      { r: 'Cái gì mà đi thì nằm, đứng cũng nằm, nhưng nằm lại đứng?', a: 'Bàn chân' },
      { r: 'Lúc trẻ mình đen mượt mà. Về già mình trắng, ấy là tôi đây. Là gì?', a: 'Sợi tóc' },
      { r: 'Trái gì mềm đỏ mượt mà. Không xanh, không chín thế mà quý ghê. Là gì?', a: 'Trái tim' },
      { r: 'Lá gì mọc ở trong người. Mà gồm hai chiếc rành rành hai bên. Là gì?', a: 'Lá phổi' },
      { r: 'Một cây mà có năm cành. Dấp nước thì héo, để dành thì tươi. Là gì?', a: 'Bàn tay' },
      { r: 'Khua môi múa mép. Nếp tẻ đủ mùi. Ngọt bùi nếm cả. Là gì?', a: 'Cái lưỡi' },
      { r: 'Năm thằng cầm hai cái sào. Đuổi đàn trâu trắng chui vào cái hang. Là gì?', a: 'Bàn tay, cái miệng' },
      { r: 'Vừa bằng trái cau. Lau chau đi trước. Là gì?', a: 'Ngón chân cái' },
      { r: 'Nhỏ thì trắng phau phau Lớn thì đen thậm thụi Già thì trụi lùi lụi Là gì?', a: 'Cái răng' },
      { r: 'Ai muốn chân sạch Thì dùng đến tôi Nhưng phải một đôi Đôi gì thế nhỉ?', a: 'Đôi dép' },
      { r: 'Lấp la lấp lánh. Treo ở trên tường. Trước khi đến trường. Bé soi chải tóc. Là cái gì?', a: 'Cái gương' },
      { r: 'Có răng mà chẳng có mồm. Giúp bé chải tóc sớm hôm đến trường. Là cái gì?', a: 'Cái lược' },
      { r: 'Thân tôi bằng sắt. Chân mắc trần nhà. Tôi có ba tay. Thay trời làm gió. Là cái gì?', a: 'Quạt trần' },
      { r: 'Cái gì bật sáng trong đêm. Giúp cho nhà dưới nhà trên sáng ngời. Là cái gì?', a: 'Bóng điện' },
      { r: 'Cái gì xốp nhẹ êm êm Mỗi khi bé ngủ, kề bên má đầu?', a: 'Cái gối' },
      { r: 'Cái gì nhỏ bé cầm tay. Nhấn phím là gặp bạn ngay thôi mà. Là cái gì?', a: 'Cái điện thoại di động' },
      { r: 'Mình khối chữ nhật. Chia thành hai ngăn. Thực phẩm, rau xanh. Luôn tươi sạch sẽ. Đố bé là gì?', a: 'Tủ lạnh' },
      { r: 'Người một nơi, tiếng một nơi. Hễ tôi cất tiếng mọi người lắng nghe. Là cái gì?', a: 'Cái đài' },
      { r: 'Tích tắc tích tắc. Kim chạy vòng quanh. Kim ngắn chỉ giờ. Kim dài chỉ phút. Tích tắc tích tắc. Là cái gì?', a: 'Cái đồng hồ' },
      { r: 'Cây gì không lá, không hoa. Sáng đêm sinh nhật cả nhà vây quanh?', a: 'Cây nến' },
      { r: 'Cây gì tích tịch tình tang. Hoà theo tiếng hát rộn vang cả nhà?', a: 'Cây đàn' },
      { r: 'Có chân mà chẳng biết đi. Có mặt phẳng lì cho bé ngồi lên. Là cái gì?', a: 'Cái ghế' },
      { r: 'Cái gì kết bằng sợi đay. Đung đưa cho bé ngủ say trưa hè?', a: 'Cái võng' },
      { r: 'Là cửa chẳng để ra vào. Để hứng gió mát, trăng vào vần thơ. Là cái gì?', a: 'Cửa sổ' },
      { r: 'Miệng tròn, lòng trắng phau phau. Đựng cơm, đựng thịt, đựng rau hằng ngày. Là cái gì?', a: 'Cái bát' },
      { r: 'Một mẹ thường có sáu con. Yêu thương mẹ sẻ nước non vơi đầy. Là cái gì?', a: 'Bộ ấm chén' },
      { r: 'Miệng tròn chỉ uống nước thôi. Uống xong chủ khách kề môi áp vào. Là gì?', a: 'Cái cốc' },
      { r: 'Thân tròn vành vạnh. Bát đĩa ngồi trên. Là cái gì?', a: 'Cái mâm' },
      { r: 'Vài hàng cước trắng. Có cán cầm tay. Giúp bé hàng ngày. Đánh răng sạch bóng. Là cái gì?', a: 'Bàn chải đánh răng' },
      { r: '“Ai muốn chân sạch Thì dùng đến tôi Nhưng phải một đôi Đôi gì thế nhỉ.” Là cái gì?', a: 'Đôi dép' },
      { r: 'Dệt từ sợi bông. Mà lại có công. Giúp người rửa mặt. Đố biết là gì?', a: 'Khăn mặt' },
      { r: 'Em tuy bé tí. Nhưng quý vô cùng. Vì em góp công. Vá may quần áo. Là cái gì?', a: 'Cái kim' },
      { r: 'Mình tròn, hình trụ. Ruột chứa nước sôi. Mọi nhà dùng tôi. Giữ cho nước nóng. Là cái gì?', a: 'Cái phích nước' },
      { r: 'Bên ngoài lửa đỏ. Trong có thức ăn. Nhà dẫu khó khăn. Cũng cần một cái. Là gì?', a: 'Cái nồi' },
      { r: 'Cái gì bay bổng trên cao. Chở bao nhiêu khách ta, Tây đi về?', a: 'Máy bay' },
      { r: 'Mặt đất, dưới nước, trên trời. Đều đi được cả, hỏi người thứ chi? Đố là cái gì?', a: 'Tàu bay' },
      { r: 'Con gì vượt sóng ra khơi. Năm châu, bốn biển tới chơi khắp vùng?', a: 'Con tàu' },
      { r: 'Con gì không mắt không tai. Có đầu, có cuối, ai ai cũng nhờ?', a: 'Con đường' },
      { r: 'Con gì ở giữa hai bờ. Những loài thủy tộc sống nhờ bên trong?', a: 'Con sông' },
      { r: 'Tôi đây hỏi hết anh hùng. Chim chi một cánh bay cùng nước non?', a: 'Cánh buồm' },
      { r: 'Nơi nào có khách tập trung. Có tàu hỏa đỗ, khách đông lên tàu?', a: 'Nhà ga' },
      { r: 'Đường gì tàu chạy sóng xô. Mênh mông xa tít không bờ bạn ơi?', a: 'Đường biển' },
      { r: 'Có tên có tuổi rõ ràng. Vệ đường tôi đứng nhìn đoàn người qua. Là cái gì?', a: 'Cột cây số' },
      { r: 'Đường gì mà có nhiều xe. Ngược xuôi lại có vỉa hè bạn ơi?', a: 'Đường bộ' },
      { r: 'Đường gì mà có đường ray. Xình xịch tàu chạy đêm ngày bạn ơi?', a: 'Đường sắt' },
      { r: 'Xe gì hai bánh. Đạp chạy bon bon. Chuông kêu kính coong. Đứng yên thì đổ.', a: 'Xe đạp' },
      { r: 'Xe hai bánh. Chạy bon bon. Máy nổ giòn. Kêu bình bịch. Là xe gì?', a: 'Xe máy' },
      { r: 'Xe bốn bánh. Chạy bon bon. Kêu píp píp. Là xe gì?', a: 'Xe ô tô' },
      { r: 'Lù lù như khối sắt. Đi lại chậm rì rì. Đoạn đường nào tôi đi. Đất đá san bằng hết. Là xe gì?', a: 'Xe lu' },
      { r: 'Xe gì ba bánh. Chở khách, chở hàng. Bác tài phải đạp?', a: 'Xe xích lu' },
      { r: 'Có mũi mà chẳng có mồm. Thế mà đến bến chuyên môn ăn hàng?', a: 'Tàu thủy' },
      { r: 'Có vòi mà chẳng có đuôi. Bụng chỉ thích chứa nước thôi mới kỳ. Bình thường chẳng nói năng chi. Gặp lửa lại cáu: “phì, phì” – lạ chưa?', a: 'Xe cứu hỏa' },
      { r: 'Tính năng nổ. Cổ vươn dài. Cứ loay hoay. Khuân vác nặng? Đố là cái gì?', a: 'Cần cẩu' },
      { r: 'Mắt đỏ, vàng, xanh. Đêm ngày đứng canh. Ngã tư đường phố. Mắt đỏ báo ‘Dừng’. Mắt xanh báo ‘Đi’. Mắt vàng ‘Chờ nhé !’ Đố biết đèn gì?', a: 'Đèn hiệu giao thông' },
      { r: 'Một mặt mà chỉ một chân. Đứng bên quốc lộ xa gần khắp nơi. Tuy rằng chẳng nói một lời. Mà nghiêm pháp luật, trái thời phạt ngay? Đố là cái gì?', a: 'Biển chỉ đường' },
      { r: 'Như cá mà lại chẳng bơi. Như thuyền ra khơi mà không bánh lái. Cũng đi lại mà chẳng có chân? Đố là cái gì?', a: 'Cài bè' },
      { r: 'Ai người đi sớm về trưa. Gió sương chẳng quản, nắng mưa chẳng sờn. Đứng canh ở các ngả đường. Người xe qua lại bốn phương an toàn?', a: 'Chú cảnh sát giao thông' },
      { r: 'Con gì ăn cỏ, đầu có hai sừng, lỗ mũi buộc thừng, kéo cày rất giỏi?', a: 'Con trâu' },
      { r: 'Con gì đuôi ngắn tai dài, mắt hồng lông mượt, có tài chạy nhanh?', a: 'Con thỏ' },
      { r: 'Con gì chân ngắn, mà lại có màng, mỏ bẹt màu vàng, hay kêu cạp cạp?', a: 'Con vịt' },
      { r: 'Bốn cột tứ trụ, người ngự lên trên, gươm bạc hai bên, chầu vua thượng đế. Là con gì?', a: 'Con voi' },
      { r: 'Con gì không có chân mà vẫn leo núi?', a: 'Con rắn' },
      { r: 'Miệng bò mà không phải miệng bò. Là con gì?', a: 'Con ốc sên' },
      { r: 'Ngày thì ngủ treo ngược, đêm thì bay đi kiếm mồi. Là con gì?', a: 'Con dơi' },
      { r: 'Lưng đầy gai nhọn, sống ở trong rừng, đêm đến kiếm ăn, ngày thì cuộn tròn?', a: 'Con nhím' },
      { r: 'Con gì có vằn, săn mồi rất giỏi, là chúa sơn lâm?', a: 'Con hổ (cọp)' },
      { r: 'Da sần sùi, tính hay la cà, nhảy xuống ao tắm, hát bài ộp ộp?', a: 'Con ếch' },
      { r: 'Con gì bé tí, chăm chỉ tha mồi, xây tổ khắp nơi, sống thành xã hội?', a: 'Con kiến' },
      { r: 'Bé bằng hạt đỗ, đi võng đi dù. Là con gì?', a: 'Con ruồi' },
      { r: 'Con gì không vú mà nuôi con?', a: 'Con gà mái' },
      { r: 'Tên con vật gì nghe đã thấy giàu sang?', a: 'Con công' },
      { r: 'Suốt đời đi với học sinh, sách vở, bút mực thân hình nhỏ nhoi?', a: 'Con chữ' },
      { r: 'Bốn chân mà chỉ có một đuôi, ăn no lại nằm, chẳng làm việc chi?', a: 'Con lợn (heo)' },
      { r: 'Thân em bé nhỏ tí ti, bụng mang ngọc sáng, bay đi khắp trời?', a: 'Con đom đóm' },
      { r: 'Con gì có cổ dài nhất?', a: 'Con hươu cao cổ' },
      { r: 'Sống dưới nước, thở bằng mang, có vảy lấp lánh, bơi lượn nhẹ nhàng?', a: 'Con cá' },
      { r: 'Con gì khi đi cũng đứng, khi đứng cũng đứng, khi nằm cũng đứng?', a: 'Con ngựa' },
      { r: 'Con gì hai cánh mà không biết bay, chỉ thích chạy nhảy trên đồng cỏ xanh?', a: 'Con đà điểu' },
      { r: 'Con gì chỉ ăn tre, trúc, mắt đen như gấu, thân hình mập tròn?', a: 'Con gấu trúc' },
      { r: 'Áo sặc sỡ, múa lượn la đà, hút mật hoa thơm, làm đẹp cho đời?', a: 'Con bướm' },
      { r: 'Con gì chân có màng, bơi lội giỏi giang, đẻ trứng trên cạn?', a: 'Con rùa' },
      { r: 'Con gì kêu ‘be be’, lông trắng như bông, cho ta len dệt áo?', a: 'Con cừu' },
      { r: 'Con gì kêu ‘chít chít’, hay rúc trong nhà, sợ mèo và sợ bẫy?', a: 'Con chuột' },
      { r: 'Con gì có cái vòi dài, tai to như quạt, sống ở châu Phi?', a: 'Con voi' },
      { r: 'Con gì có bướu trên lưng, đi qua sa mạc không cần uống nước?', a: 'Con lạc đà' },
      { r: 'Con gì có túi trước bụng để đựng con?', a: 'Con chuột túi (Kangaroo)' },
      { r: 'Con gì có bộ lông xù, mùa đông ngủ suốt, không cần ăn uống?', a: 'Con gấu' },
      { r: 'Con gì tám vòi như tám tay, phun mực đen ngòm khi gặp nguy?', a: 'Con bạch tuộc' },
      { r: 'Con gì sống ở biển sâu, to như quả núi, phun nước lên trời?', a: 'Con cá voi' },
      { r: 'Con gì thay đổi màu da, để lẩn trốn kẻ thù tài tình?', a: 'Con tắc kè hoa' },
      { r: 'Con gì không cánh, không chân, chỉ có một thân, trườn đi khắp nơi?', a: 'Con giun' },
      { r: 'Con gì hút máu người, thân hình dẹp lép, sống nhờ ao tù?', a: 'Con đỉa' },
      { r: 'Con gì miệng rộng, mắt lồi, hay nằm ở bờ sông chờ mồi?', a: 'Con cá sấu' },
      { r: 'Con gì có bộ lông dày, sống ở Bắc Cực, thích ăn cá hồi?', a: 'Gấu Bắc Cực' },
      { r: 'Con gì chuyên bắt muỗi, bốn cánh trong suốt, bay lượn vờn vờn?', a: 'Con chuồn chuồn' },
      { r: 'Con gì nhỏ bé, xây tổ trên cây, hót líu lo cả ngày?', a: 'Con chim' },
      { r: 'Con gì có bộ râu dài, thích ăn cá và hay kêu ‘meo meo’?', a: 'Con mèo' },
      { r: 'Con gì sống thành đàn, bay về phương Nam tránh rét?', a: 'Chim di trú' },
      { r: 'Con gì có mai rất cứng, đi lại chậm chạp?', a: 'Con rùa' },
      { r: 'Con gì có nọc độc ở đuôi, sống trong sa mạc?', a: 'Con bọ cạp' },
      { r: 'Con gì hay bắt chước tiếng người?', a: 'Con vẹt' },
      { r: 'Con gì thân dài, nhiều chân, trông như con rết?', a: 'Con rết' },
      { r: 'Con gì sống dưới đáy biển, thân hình gai góc, có 5 cánh tay?', a: 'Con sao biển' },
      { r: 'Da cóc mà bọc bột lọc, bột lọc mà bọc hòn than. Là quả gì?', a: 'Quả nhãn' },
      { r: 'Thân em trắng nõn nà, đầu đội nón xanh. Là cây gì?', a: 'Cây giá đỗ' },
      { r: 'Cũng gọi là hạt, nhưng chẳng nảy mầm, rơi vãi khắp sân, đêm hè lấp lánh?', a: 'Hạt mưa' },
      { r: 'Quả gì vỏ nhiều gai, ruột vàng như nghệ, ăn vào ngọt thơm?', a: 'Quả mít' },
      { r: 'Thân cằn cỗi, lá khẳng khiu, đông về lột áo, hè lại xanh um?', a: 'Cây bàng' },
      { r: 'Quả gì tên gọi như kim loại quý, vỏ xanh ruột đỏ, mát lạnh ngày hè?', a: 'Quả dưa hấu' },
      { r: 'Hoa gì nở trên cành, rồi rơi xuống đất nuôi mình?', a: 'Hoa lạc (đậu phộng)' },
      { r: 'Cây gì không cành, chỉ có một thân, lá như lược thưa?', a: 'Cây cau' },
      { r: 'Quả gì có mắt xung quanh, chín vàng thơm phức, ai ăn cũng khen?', a: 'Quả dứa (thơm)' },
      { r: 'Tên một loài hoa, lại là tên một con sông?', a: 'Hoa Hồng' },
      { r: 'Vốn dòng ái quốc, một dạ trung trinh, hè về đỏ rực, sân trường chúng em?', a: 'Hoa phượng' },
      { r: 'Cây gì lá tựa con dao, quả tựa con trâu, sống trên đồi núi?', a: 'Cây dứa dại' },
      { r: 'Thân tròn nhiều đốt, lá tựa gươm đao, ruột đặc ngọt ngào?', a: 'Cây mía' },
      { r: 'Cây gì thân cao, lá to như quạt, cho bóng mát rượi, quả kết thành buồng?', a: 'Cây cọ' },
      { r: 'Quả gì nhiều mắt, không có lông mày, chín vàng thơm lừng, xếp thành một nải?', a: 'Quả chuối' },
      { r: 'Lá thì trên mây, củ thì dưới đất. Là cây gì?', a: 'Cây khoai lang' },
      { r: 'Cây gì không lá không hoa, mà ai cũng gọi là bà cụ non?', a: 'Cây xương rồng' },
      { r: 'Hoa gì chỉ nở về đêm, hương thơm ngan ngát, trắng tinh dịu dàng?', a: 'Hoa quỳnh' },
      { r: 'Quả gì tên gọi chẳng thơm, ăn vào lại khiến người ta ngại gần?', a: 'Quả sầu riêng' },
      { r: 'Củ gì đo đỏ, thỏ rất thích ăn?', a: 'Củ cà rốt' },
      { r: 'Lá thì cuộn tròn, bọc lấy thân mình, càng vào càng trắng?', a: 'Cây bắp cải' },
      { r: 'Hoa gì tên gọi như mặt trời?', a: 'Hoa hướng dương' },
      { r: 'Gần bùn mà chẳng hôi tanh mùi bùn. Là hoa gì?', a: 'Hoa sen' },
      { r: 'Quả gì có vỏ màu nâu, ruột trắng, nước ngọt mát lành?', a: 'Quả dừa' },
      { r: 'Cây gì mà lại có răng, không nhai không nói, không ăn bao giờ?', a: 'Cây lược' },
      { r: 'Quả gì có vỏ xanh rì, ruột chia năm múi, nấu canh chua ngon?', a: 'Quả khế' },
      { r: 'Hoa gì báo hiệu xuân về, nở vàng rực rỡ khắp miền Nam ta?', a: 'Hoa mai' },
      { r: 'Cây gì một mẹ, sinh được vạn con, con nào con nấy, áo quần xác xơ?', a: 'Cây chuối' },
      { r: 'Quả gì tên gọi thật kiêu sa, vừa là quả ăn, vừa là đồ chơi?', a: 'Quả bóng' },
      { r: 'Củ gì mặc áo nhiều lớp, càng bóc càng cay xè mắt?', a: 'Củ hành' },
      { r: 'Hoa gì báo hiệu học trò nghỉ hè?', a: 'Hoa phượng' },
      { r: 'Quả gì tên gọi như một loài chim?', a: 'Quả quạ' },
      { r: 'Lá xanh, bông trắng, lại chen nhụy vàng. Là hoa gì?', a: 'Hoa cúc' },
      { r: 'Cây gì sinh ra đã bị trói?', a: 'Cây bó củi' },
      { r: 'Quả gì gai góc, béo ngậy bên trong, là vua các loại quả?', a: 'Quả sầu riêng' },
      { r: 'Hoa gì tên gọi là mười, chỉ nở khi nắng, tắt khi chiều tà?', a: 'Hoa mười giờ' },
      { r: 'Cây gì xanh lá, quả tròn, vỏ có đốm trắng, ruột son rất mềm?', a: 'Cây đu đủ' },
      { r: 'Cây gì nho nhỏ, hạt nó nuôi người, chín vàng khắp nơi, dân làng đi hái?', a: 'Cây lúa' },
      { r: 'Hoa gì màu tím, mọc thành từng chùm, rung rinh trong gió?', a: 'Hoa bằng lăng' },
      { r: 'Quả gì vỏ tím, ruột trắng ngà, ăn rất ngọt?', a: 'Quả măng cụt' },
      { r: 'Củ gì có tên mà không có họ?', a: 'Củ từ' },
      { r: 'Quả gì tên gọi như cái tai người?', a: 'Quả mộc nhĩ (nấm mèo)' },
      { r: 'Cây gì chỉ có một lá?', a: 'Cây bài' },
      { r: 'Hoa gì nở trắng sân trường, hương thơm thoang thoảng vấn vương lòng người?', a: 'Hoa sữa' },
      { r: 'Quả gì tròn xoe, có nhiều múi, vị chua ngọt, nhiều vitamin C?', a: 'Quả cam' },
      { r: 'Cây gì mang họ của loài chim, quả nó nấu chè rất ngon?', a: 'Cây đậu xanh' },
      { r: 'Củ gì mọc dưới đất, ruột màu tím, nấu canh rất bùi?', a: 'Củ khoai sọ' },
      { r: 'Quả gì tên gọi rất hiền, nhưng ăn vào lại rất cay?', a: 'Quả ớt' },
      { r: 'Hoa gì tên gọi vừa sạch lại vừa thơm?', a: 'Hoa ly' },
      { r: 'Cây gì sống ở trên non, mùa đông lá rụng, mùa xuân đâm chồi?', a: 'Cây đào' },
      { r: 'Cái gì có nhiều răng mà không nhai được?', a: 'Cái lược' },
      { r: 'Cái gì có bốn chân mà không biết đi?', a: 'Cái bàn / Cái ghế' },
      { r: 'Cái gì càng lau càng ướt?', a: 'Cái khăn' },
      { r: 'Cái gì có mặt mà không có đầu, có số mà không có chữ?', a: 'Cái đồng hồ' },
      { r: 'Thân hình bằng sắt, nổi được trên sông, chở chú hải quân, tuần tra trên biển?', a: 'Tàu thủy' },
      { r: 'Miệng tròn, một mắt, không có chân tay, hễ ai động vào, kêu la inh ỏi?', a: 'Cái trống' },
      { r: 'Vừa bằng một gang, mà lang khắp nhà. Là cái gì?', a: 'Cái chổi' },
      { r: 'Ruột thì thẳng băng, tính hay làm bạn, với bạn học sinh, vẽ đường kẻ dọc?', a: 'Cây thước kẻ' },
      { r: 'Thân em nửa chuột nửa chim, ngày treo chân ngủ, tối tìm mồi bay?', a: 'Cái máy bay (chơi chữ: dơi -> bat -> bay)' },
      { r: 'Lỗ mũi em ở trên đầu, thân em ở dưới đất sâu muôn trùng?', a: 'Cái giếng' },
      { r: 'Mình rồng, đuôi phụng le te, mùa đông ấp trứng, mùa hè nở con?', a: 'Cái quạt giấy' },
      { r: 'Da trắng muốt, ruột trắng tinh, bạn của học sinh, là cái gì?', a: 'Viên phấn' },

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // =========================================================================
    // ĐỘ KHÓ CHO ĐÁP ÁN: chọn 3 phương án nhiễu "gần giống" đáp án đúng
    // (cùng nhóm/chủ đề) trước, chỉ lấy ngẫu nhiên toàn bộ nếu không đủ.
    // =========================================================================
    function buildTrickyChoices(correctAnswer, sameGroupPool, allPool, count = 3) {
      let same = [...new Set(sameGroupPool.filter(x => x !== correctAnswer))];
      same = shuffleArray(same);
      let picks = same.slice(0, count);
      if (picks.length < count) {
        let rest = [...new Set(allPool.filter(x => x !== correctAnswer && !picks.includes(x)))];
        rest = shuffleArray(rest);
        picks = picks.concat(rest.slice(0, count - picks.length));
      }
      return shuffleArray([correctAnswer, ...picks]);
    }

    // Từ loại/nhóm của đáp án (dựa vào từ chỉ loại đứng đầu: con, cái, quả, cây, hoa, củ...)
    function answerGroup(ans) {
      return String(ans).trim().split(/\s+/)[0].toLowerCase();
    }

    // Nhóm "vần" gần giống nhau (2 kí tự cuối) — dùng cho các mục ghép âm/vần
    function rhymeGroup(ans) {
      const s = String(ans).trim().toLowerCase();
      return s.slice(-2);
    }

    // Các cặp chữ cái dễ nhầm lẫn trong tiếng Việt — dùng cho mục Điền Chữ Tranh
    const CONFUSABLE_LETTER_GROUPS = [
      ['C', 'K', 'Q'], ['D', 'GI', 'R'], ['L', 'N'], ['S', 'X'],
      ['TR', 'CH'], ['NH', 'NG', 'NGH'], ['V', 'D'], ['G', 'GH'], ['B', 'P'], ['T', 'TH']
    ];
    function confusableLetters(letter) {
      const grp = CONFUSABLE_LETTER_GROUPS.find(g => g.includes(letter));
      return grp ? grp.filter(x => x !== letter) : [];
    }

    // =========================================================================
    function initOrderSentenceQuestion(item) {
      orderPlacedWords = [];
      orderAvailableWords = item.words.map((w, idx) => ({ id: idx, word: w }));
      orderAvailableWords = shuffleArray(orderAvailableWords);

      if (orderAvailableWords.map(o => o.word).join(' ') === item.words.join(' ') && orderAvailableWords.length > 1) {
        orderAvailableWords.reverse();
      }

      renderOrderSentenceView();
    }

    function renderOrderSentenceView() {
      const idx = currentTopicIndex;
      const total = currentTopicList.length;
      const item = currentTopicList[idx];

      const placedHtml = orderPlacedWords.map(obj => `
        <button class="word-token-btn word-token-placed" onclick="removePlacedWord(${obj.id})">
          ${obj.word} <i class="fa-solid fa-xmark" style="font-size: 16px; opacity: 0.7;"></i>
        </button>
      `).join('');

      const availableHtml = orderAvailableWords.map(obj => `
        <button class="word-token-btn" onclick="placeWord(${obj.id})">
          ${obj.word}
        </button>
      `).join('');

      container.innerHTML = `
        <div class="question-prompt">
          <span>Bé hãy bấm chọn các từ bên dưới để sắp xếp thành câu đúng:</span>
          <button class="speaker-btn" onclick="resetOrderSentence()">
            <i class="fa-solid fa-arrows-rotate"></i> Xếp lại từ đầu
          </button>
        </div>

        <div class="order-sentence-wrap">
          <div style="font-size: 18px; font-weight: 800; color: #64748B;">✨ Câu ghép của bé (bấm từ để gỡ):</div>
          <div class="sentence-answer-zone" id="sentence-answer-box">
            ${placedHtml || '<span style="color: #94A3B8; font-size: 19px; font-weight: 700;">(Chạm vào các từ bên dưới để ghép câu vào đây)</span>'}
          </div>

          <div style="font-size: 18px; font-weight: 800; color: #64748B;">📝 Các từ ngữ được xáo trộn:</div>
          <div class="sentence-pool-zone">
            ${availableHtml || '<span style="color: #10B981; font-size: 19px; font-weight: 800;"><i class="fa-solid fa-circle-check"></i> Bé đã chọn hết các từ!</span>'}
          </div>
        </div>

        <div class="mascot-bar">
          <span class="mascot-ico">🐰</span>
          <span class="mascot-msg">Bé hãy xếp các từ thành câu có nghĩa hoàn chỉnh nhé!</span>
        </div>

        <div class="nav-control-bar">
          <button class="btn-step" onclick="prevQuestion()" ${idx === 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i> Câu trước
          </button>
          <div class="step-indicator">🌸 Câu ${idx + 1} / ${total} 🌸</div>
          <button class="btn-step btn-next-step" onclick="nextQuestion()">
            ${idx === total - 1 ? 'Vòng mới <i class="fa-solid fa-arrows-rotate"></i>' : 'Câu sau <i class="fa-solid fa-arrow-right"></i>'}
          </button>
        </div>
      `;
    }

    function placeWord(id) {
      const foundIdx = orderAvailableWords.findIndex(x => x.id === id);
      if (foundIdx > -1) {
        const itemObj = orderAvailableWords.splice(foundIdx, 1)[0];
        orderPlacedWords.push(itemObj);
        playTone('correct');
        renderOrderSentenceView();
        checkSentenceCompletion();
      }
    }

    function removePlacedWord(id) {
      const foundIdx = orderPlacedWords.findIndex(x => x.id === id);
      if (foundIdx > -1) {
        const itemObj = orderPlacedWords.splice(foundIdx, 1)[0];
        orderAvailableWords.push(itemObj);
        renderOrderSentenceView();
      }
    }

    function resetOrderSentence() {
      const item = currentTopicList[currentTopicIndex];
      initOrderSentenceQuestion(item);
    }

    function checkSentenceCompletion() {
      const item = currentTopicList[currentTopicIndex];
      if (orderAvailableWords.length === 0) {
        const assembledText = orderPlacedWords.map(x => x.word).join(' ').trim();
        const correctText = item.words.join(' ').trim();

        const box = document.getElementById('sentence-answer-box');
        if (assembledText.toLowerCase() === correctText.toLowerCase()) {
          if (box) box.classList.add('completed-correct');
          triggerConfetti();
          stars += 1;
          document.getElementById('stars-count').innerText = stars;

          speakClear(item.full);
        } else {
          if (box) box.classList.add('completed-wrong');
          playTone('wrong');

          setTimeout(() => {
            if (box) box.classList.remove('completed-wrong');
          }, 900);
        }
      }
    }

    // =========================================================================
    // RENDER CÂU HỎI CÁC CHUYÊN ĐỀ KHÁC
    // =========================================================================
    function renderCurrentQuestion() {
      const idx = currentTopicIndex;
      const total = currentTopicList.length;
      const item = currentTopicList[idx];

      let promptHtml = '';
      let stageHtml = '';
      let choicesHtml = '';
      let mascotMsg = '';
      let autoSpeech = '';

      // 1.2 THỬ TÀI TÌM CHỮ
      if (currentTopicKey === 'letters_quiz') {
        currentAnswer = `${item.u} ${item.l}`;
        const allPairs = BANK_LETTERS_QUIZ.map(x => `${x.u} ${x.l}`);
        let choices = [currentAnswer, ...allPairs.filter(x => x !== currentAnswer).sort(() => Math.random() - 0.5).slice(0, 3)].sort(() => Math.random() - 0.5);

        promptHtml = `Bé hãy lắng nghe âm thanh và chọn chữ đúng <button class="speaker-btn" onclick="speakClear('Bé hãy tìm: ${item.n}')"><i class="fa-solid fa-volume-high"></i> Nghe lại âm</button>`;
        stageHtml = `
          <div style="font-size: 52px;">🎧 👂 🌸</div>
          <div style="font-size: 20px; font-weight: 900; color: #E11D48; margin-top: 4px;">Bé hãy lắng nghe âm đọc của chị Ban Mai rồi chọn chữ cái đúng nhé!</div>
        `;
        choicesHtml = choices.map(c => `<button class="choice-btn" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = `Chữ cái nào vừa phát ra âm thanh vậy bé ơi?`;
        autoSpeech = `Bé hãy tìm ${item.n}`;
      }
      // 2. 5 THANH ĐIỆU
      else if (currentTopicKey === 'tones') {
        currentAnswer = item.t;
        const allTones = ['Dấu Sắc ( / )', 'Dấu Huyền ( \\ )', 'Dấu Hỏi ( ? )', 'Dấu Ngã ( ~ )', 'Dấu Nặng ( . )', 'Thanh Ngang (Không dấu)'];
        let choices = [currentAnswer, ...allTones.filter(x => x !== currentAnswer).sort(() => Math.random() - 0.5).slice(0, 3)].sort(() => Math.random() - 0.5);

        promptHtml = `Tiếng "${item.w}" mang thanh điệu gì? <button class="speaker-btn" onclick="speakClear('${item.g}')"><i class="fa-solid fa-volume-high"></i> Nghe từ</button>`;
        stageHtml = `
          <div style="font-size: 56px; font-weight: 900; color: #E11D48;">${item.w}</div>
          <div style="font-size: 19px; font-weight: 800; color: #64748B;">Bé chú ý dấu thanh trên chữ cái nhé!</div>
        `;
        choicesHtml = choices.map(c => `<button class="choice-btn" style="font-size: 19px;" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = item.g;
        autoSpeech = `Tiếng ${item.w} mang thanh điệu gì?`;
      }
      // 3. GHÉP ÂM - VẦN
      else if (currentTopicKey === 'blends') {
        currentAnswer = item.r;
        const allR = BANK_BLENDS.map(x => x.r);
        const sameRhyme = BANK_BLENDS.filter(x => rhymeGroup(x.r) === rhymeGroup(currentAnswer)).map(x => x.r);
        let choices = buildTrickyChoices(currentAnswer, sameRhyme, allR, 3);

        promptHtml = `Ghép chữ cái tạo thành tiếng đúng <button class="speaker-btn" onclick="speakClear('${item.sp}')"><i class="fa-solid fa-volume-high"></i> Đánh vần</button>`;
        stageHtml = `
          <div style="font-size: 46px; font-weight: 900; color: #334155;">
            ${item.c} + ${item.v} = <span style="color: #EC4899;">?</span>
          </div>
          <div style="font-size: 19px; font-weight: 800; color: #64748B;">Bé bấm vào nút nghe để được Thỏ Hồng hướng dẫn đánh vần nha!</div>
        `;
        choicesHtml = choices.map(c => `<button class="choice-btn" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = `Bé phát âm xem ra tiếng gì nào!`;
        autoSpeech = item.sp;
      }
      // 4. ĐiỀN CHỮ TRANH
      else if (currentTopicKey === 'missing') {
        currentAnswer = item.m;
        const allM = ['B', 'C', 'D', 'Đ', 'G', 'H', 'K', 'L', 'M', 'N', 'P', 'R', 'S', 'T', 'V', 'X', 'CH', 'KH', 'NH', 'TH', 'TR', 'NG'];
        const sameSound = confusableLetters(currentAnswer).filter(x => allM.includes(x));
        let choices = buildTrickyChoices(currentAnswer, sameSound, allM, 3);

        promptHtml = `Điền chữ cái còn thiếu vào dấu gạch: <button class="speaker-btn" onclick="speakClear('${item.snd}')"><i class="fa-solid fa-volume-high"></i> Gợi ý tranh</button>`;
        stageHtml = `
          <span style="font-size: 60px;">${item.emo}</span>
          <div style="font-size: 40px; font-weight: 900; color: #1E293B; letter-spacing: 2px;">${item.d}</div>
        `;
        choicesHtml = choices.map(c => `<button class="choice-btn" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = item.snd;
        autoSpeech = item.snd;
      }
      // 5. SẮP XẾP CÂU ĐÚNG
      else if (currentTopicKey === 'order_sent') {
        initOrderSentenceQuestion(item);
        return;
      }
      // 6. CHÍNH TẢ CHUẨN
      else if (currentTopicKey === 'spell') {
        currentAnswer = item.a;
        let choices = [];
        if (item.q.includes('c hay k')) choices = ['c', 'k'];
        else if (item.q.includes('g hay gh')) choices = ['g', 'gh'];
        else if (item.q.includes('ng hay ngh')) choices = ['ng', 'ngh'];
        else if (item.q.includes('s hay x')) choices = ['s', 'x'];
        else if (item.q.includes('l hay n')) choices = ['l', 'n'];
        else if (item.q.includes('tr hay ch')) choices = ['tr', 'ch'];
        else if (item.q.includes('d hay gi')) choices = ['d', 'gi'];
        else if (item.q.includes('v hay d')) choices = ['v', 'd'];
        else if (item.q.includes('r hay g')) choices = ['r', 'g'];
        else choices = [item.a, 'b', 'c', 'd'].slice(0, 2);

        promptHtml = `${item.q} <button class="speaker-btn" onclick="speakClear('${item.f}')"><i class="fa-solid fa-volume-high"></i> Phát âm từ</button>`;
        stageHtml = `
          <div style="font-size: 34px; font-weight: 900; color: #1E293B;">${item.q}</div>
          <div style="font-size: 19px; font-weight: 800; color: #D97706; margin-top: 4px;">💡 Bí kíp: ${item.h}</div>
        `;
        choicesHtml = choices.map(c => `<button class="choice-btn" style="font-size: 22px; padding: 12px 24px;" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = `Quy tắc nào giúp bé chọn đúng nhỉ?`;
        autoSpeech = item.q;
      }
      // 7. VẦN ĐÔI & GHÉP
      else if (currentTopicKey === 'diphthongs') {
        currentAnswer = item.a;
        const allV = [...new Set(BANK_DIPHTHONGS.map(x => x.a))];
        const sameStart = allV.filter(x => x.charAt(0) === currentAnswer.charAt(0));
        let choices = buildTrickyChoices(currentAnswer, sameStart, allV, 3);

        promptHtml = `${item.q} <button class="speaker-btn" onclick="speakClear('${item.sp}')"><i class="fa-solid fa-volume-high"></i> Đánh vần</button>`;
        stageHtml = `<div style="font-size: 30px; font-weight: 900; color: #0284C7; line-height: 1.4;">${item.q}</div>`;
        choicesHtml = choices.map(c => `<button class="choice-btn" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = `Bé chú ý nguyên âm đôi nhé!`;
        autoSpeech = item.q;
      }
      // 8. GHÉP TỪ VÀO CÂU
      else if (currentTopicKey === 'sentences') {
        currentAnswer = item.a;
        let choices = [...item.pool].sort(() => Math.random() - 0.5);

        promptHtml = `Điền từ thích hợp để hoàn thành câu <button class="speaker-btn" onclick="speakClear('${item.full}')"><i class="fa-solid fa-volume-high"></i> Nghe câu đúng</button>`;
        stageHtml = `<div style="font-size: 34px; font-weight: 900; color: #1E293B;">${item.q}</div>`;
        choicesHtml = choices.map(c => `<button class="choice-btn" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = `Từ nào ghép vào câu có nghĩa nhất bé nhỉ?`;
        autoSpeech = '';
      }
      // 9. NỐI TỪ VỚI HÌNH
      else if (currentTopicKey === 'match') {
        currentAnswer = item.w;
        const allW = BANK_MATCH.map(x => x.w);
        const sameGroupW = BANK_MATCH.filter(x => answerGroup(x.w) === answerGroup(currentAnswer)).map(x => x.w);
        let choices = buildTrickyChoices(currentAnswer, sameGroupW, allW, 3);

        promptHtml = `Hình ảnh dưới đây gọi tên là gì? <button class="speaker-btn" onclick="speakClear('${item.sp}')"><i class="fa-solid fa-volume-high"></i> Gợi ý</button>`;
        stageHtml = `<span style="font-size: 68px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1));">${item.emo}</span>`;
        choicesHtml = choices.map(c => `<button class="choice-btn" style="font-size: 20px;" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = item.sp;
        autoSpeech = `Hình ảnh này gọi tên là gì?`;
      }
      // 10. ĐỐ VUI BÉ NGOAN
      else if (currentTopicKey === 'riddles') {
        currentAnswer = item.a;
        const allA = BANK_RIDDLES.map(x => x.a);
        const sameGroupA = BANK_RIDDLES.filter(x => answerGroup(x.a) === answerGroup(currentAnswer)).map(x => x.a);
        let choices = buildTrickyChoices(currentAnswer, sameGroupA, allA, 3);

        promptHtml = `Đố vui thông minh cùng Thỏ Hồng <button class="speaker-btn" onclick="speakClear('${item.r.replace(/'/g, "\\'")}')"><i class="fa-solid fa-volume-high"></i> Nghe câu đố</button>`;
        stageHtml = `<div style="font-size: 24px; font-weight: 800; color: #7C3AED; line-height: 1.45; max-width: 760px;">"${item.r}"</div>`;
        choicesHtml = choices.map(c => `<button class="choice-btn" style="font-size: 19px;" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = `Bé đã đoán ra là cái gì hay con gì chưa?`;
        autoSpeech = item.r;
      }
      // 11. TỪ CHỈ SỰ VẬT - HĐ - ĐẶC ĐIỂM
      else if (currentTopicKey === 'wordtype') {
        currentAnswer = item.type;
        const allTypes = ['Sự vật', 'Hoạt động', 'Đặc điểm'];
        let choices = [currentAnswer, ...allTypes.filter(x => x !== currentAnswer)].sort(() => Math.random() - 0.5);

        promptHtml = `Từ "${item.w}" thuộc nhóm từ chỉ gì? <button class="speaker-btn" onclick="speakClear('${item.hint}')"><i class="fa-solid fa-volume-high"></i> Gợi ý</button>`;
        stageHtml = `
          <span style="font-size: 56px;">${item.emo}</span>
          <div style="font-size: 32px; font-weight: 900; color: #1E293B;">${item.w}</div>
        `;
        choicesHtml = choices.map(c => `<button class="choice-btn" onclick="checkAnswer(this, '${c}')">${c}</button>`).join('');
        mascotMsg = item.hint;
        autoSpeech = `Từ ${item.w} thuộc nhóm từ chỉ gì?`;
      }

      container.innerHTML = `
        <div class="question-prompt">${promptHtml}</div>
        <div class="stage-box">${stageHtml}</div>
        <div class="choices-grid">${choicesHtml}</div>
        <div class="mascot-bar">
          <span class="mascot-ico">🐰</span>
          <span class="mascot-msg">${mascotMsg}</span>
        </div>

        <div class="nav-control-bar">
          <button class="btn-step" onclick="prevQuestion()" ${idx === 0 ? 'disabled' : ''}>
            <i class="fa-solid fa-arrow-left"></i> Câu trước
          </button>
          <div class="step-indicator">🌸 Câu ${idx + 1} / ${total} 🌸</div>
          <button class="btn-step btn-next-step" onclick="nextQuestion()">
            ${idx === total - 1 ? 'Vòng mới <i class="fa-solid fa-arrows-rotate"></i>' : 'Câu sau <i class="fa-solid fa-arrow-right"></i>'}
          </button>
        </div>
      `;

      if (autoSpeech) {
        speakClear(autoSpeech);
      }
    }

    function checkAnswer(btnElement, selected) {
      if (String(selected).trim().toLowerCase() === String(currentAnswer).trim().toLowerCase()) {
        btnElement.classList.add('correct');
        triggerConfetti();
        stars += 1;
        document.getElementById('stars-count').innerText = stars;

        speakClear(String(selected));
        // Không tự động chuyển câu ở bất kỳ mục nào — bé phải bấm "Câu trước / Câu sau"
      } else {
        btnElement.classList.add('wrong');
        playTone('wrong');

        setTimeout(() => {
          btnElement.classList.remove('wrong');
        }, 800);
      }
    }
  </script>
</body>
</html>
